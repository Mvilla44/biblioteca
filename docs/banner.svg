<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgLib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E29"/>
      <stop offset="100%" stop-color="#212C3B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgLib)"/>

  <!-- shelf line -->
  <line x1="860" y1="262" x2="1160" y2="262" stroke="#3B4A5E" stroke-width="2"/>

  <!-- book stack -->
  <rect x="880" y="118" width="26" height="144" rx="2" fill="#B67B2A"/>
  <rect x="914" y="90"  width="26" height="172" rx="2" fill="#D8973C"/>
  <rect x="948" y="140" width="26" height="122" rx="2" fill="#8B98AC"/>
  <rect x="982" y="72"  width="26" height="190" rx="2" fill="#E7B368"/>
  <rect x="1016" y="108" width="26" height="154" rx="2" fill="#3B4A5E"/>
  <rect x="1050" y="130" width="26" height="132" rx="2" fill="#D8973C"/>
  <circle cx="995" cy="96" r="5" fill="#161E29"/>

  <!-- text -->
  <text x="60" y="120" font-size="42" font-weight="700" fill="#EDEFF3">Sistema de Gestión</text>
  <text x="60" y="168" font-size="42" font-weight="700" fill="#EDEFF3">de Biblioteca</text>

  <text x="60" y="205" font-size="19" fill="#93A1B5">Gestión de libros, usuarios y préstamos</text>

  <!-- chips -->
  <g font-size="16" fill="#EDEFF3">
    <rect x="60" y="228" width="66" height="34" rx="8" fill="none" stroke="#D8973C" stroke-width="1.4"/>
    <text x="78" y="250">Java</text>

    <rect x="138" y="228" width="86" height="34" rx="8" fill="none" stroke="#D8973C" stroke-width="1.4"/>
    <text x="156" y="250">Maven</text>

    <rect x="236" y="228" width="98" height="34" rx="8" fill="none" stroke="#D8973C" stroke-width="1.4"/>
    <text x="254" y="250">JUnit 5</text>
  </g>
</svg>
